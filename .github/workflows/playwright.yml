name: Playwright BDD

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Run Playwright BDD tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps

      - name: Generate BDD tests and run Playwright
        run: npm test

      - name: Upload Playwright HTML report
        id: upload-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Write test results summary
        if: always()
        env:
          REPORT_ARTIFACT_URL: ${{ steps.upload-report.outputs.artifact-url }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'test-results/results.json'
          let stats = { expected: 0, unexpected: 0, skipped: 0, flaky: 0 }

          if (fs.existsSync(path)) {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'))
            stats = { ...stats, ...(report.stats || {}) }
          }

          const passed = stats.expected
          const failed = stats.unexpected
          const skipped = stats.skipped
          const flaky = stats.flaky
          const total = passed + failed + skipped + flaky
          const artifactUrl = process.env.REPORT_ARTIFACT_URL
          const lines = [
            '## Playwright BDD — resultados',
            '',
            `![Passed](https://img.shields.io/badge/Passed-${passed}-brightgreen) ![Failed](https://img.shields.io/badge/Failed-${failed}-${failed ? 'red' : 'brightgreen'}) ![Skipped](https://img.shields.io/badge/Skipped-${skipped}-lightgrey)`,
            '',
            '| Resultado | Cenários |',
            '|---|---:|',
            `| ✅ Aprovados | ${passed} |`,
            `| ❌ Falhos | ${failed} |`,
            `| ⏭️ Ignorados | ${skipped} |`,
            `| 🔁 Flaky | ${flaky} |`,
            `| **Total** | **${total}** |`,
            '',
            '```mermaid',
            'pie showData',
            '  title Resultados dos testes Playwright',
            `  "Aprovados" : ${passed}`,
            `  "Falhos" : ${failed}`,
            `  "Ignorados" : ${skipped}`,
            `  "Flaky" : ${flaky}`,
            '```',
            '',
            artifactUrl
              ? `[📊 Baixar relatório HTML do Playwright](${artifactUrl})`
              : 'Relatório HTML: artifact não foi criado nesta execução.',
            '',
            'Screenshots e traces de cenários com falha estão anexados ao relatório HTML e ao artifact `playwright-failure-evidence`.',
            '',
          ]

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`)
          NODE
